<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beatora Vibes</title>

<style>

/* ===== GLOBAL ===== */
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#0b0b12;
  color:white;
  text-align:center;
}

/* ===== HEADER ===== */
header{
  padding:40px 20px;
  background:radial-gradient(circle,#1a0033,#000814);
}

.logo{
  width:100px;
  max-width:90%;
  filter:drop-shadow(0 0 20px #6a00ff);
}

.tagline{
  margin-top:10px;
  opacity:0.8;
}

/* ===== NAV ===== */
nav{
  background:#14141d;
  padding:12px;
  display:flex;
  justify-content:center;
  gap:20px;
  flex-wrap:wrap;
}

nav a{
  color:white;
  text-decoration:none;
  font-weight:bold;
}

/* ===== SECTION ===== */
section{
  padding:50px 20px;
}

h2{
  margin-bottom:25px;
}

/* ===== CARD ===== */
.card{
  background:#151520;
  max-width:400px;
  margin:auto;
  padding:25px;
  border-radius:15px;
  box-shadow:0 0 20px rgba(106,0,255,0.5);
}

/* ===== AUDIO ===== */
audio{
  width:100%;
  margin-top:15px;
}

/* ===== PLAYLIST ===== */
.playlist{
  list-style:none;
  padding:0;
  margin-top:20px;
}

.playlist li{
  padding:10px;
  margin:8px 0;
  background:#1b1b2a;
  border-radius:8px;
  cursor:pointer;
  transition:0.3s;
}

.playlist li:hover{
  background:#6a00ff;
}

/* ===== BUTTON ===== */
.button{
  display:inline-block;
  margin-top:20px;
  padding:12px 20px;
  background:linear-gradient(45deg,#6a00ff,#00c3ff);
  color:white;
  text-decoration:none;
  border-radius:10px;
  font-weight:bold;
}

/* ===== FOOTER ===== */
footer{
  background:#14141d;
  padding:15px;
  margin-top:40px;
  opacity:0.7;
  font-size:14px;
}

</style>
</head>

<body>

<!-- ===== HEADER ===== -->
<header>
  <img src="logo.png" class="logo">
  <div class="tagline">Feel the Beat • Feel the Vibe</div>
</header>

<nav>
  <a href="#music">Music</a>
  <a href="#ebook">eBook</a>
  <a href="https://instagram.com/beatora.vibes" target="_blank">Instagram</a>
</nav>

<!-- ===== MUSIC SECTION ===== -->
<section id="music">
  <h2>🎵 My Playlist</h2>

  <div class="card">

    <audio id="audioPlayer" controls controlsList="nodownload">
      <source src="Pal Saath.mp3" type="audio/mpeg">
    </audio>

    <ul class="playlist">
      <li onclick="playSong('Pal Saath.mp3')">Pal Saath</li>
      <li onclick="playSong('Nayi-Subah.mp3')">Nayi Subah</li>
      <li onclick="playSong('Aag Ban Jaun.mpeg')">Aag Ban Jaun</li>
      <li onclick="playSong('Yeh Dosti Thi Ya Sapna Tha.mpeg')">
        Yeh Dosti Thi Ya Sapna Tha
      </li>
    </ul>

  </div>
</section>

<!-- ===== BOOKS SECTION ===== -->
<section id="books" class="reveal">

  <h2>📘Ebooks </h2>

  <div class="container">

    <div class="card">

      <p> Student Productivity Blueprint 
        (Study smarter. Score higher. No stress.)</p>

      <!-- BUY BUTTON -->
    <a href="https://rzp.io/rzp/3FBFV4HJ" target="_blank" class="button buy">
      Buy Now ₹49
    </a>

    <!-- SAMPLE DOWNLOAD -->
    <a href="Student-Productivity-Blueprint-sample.pdf" target="_blank" class="button sample">
      Download Sample
    </a>


    </div>

  </div>

</section>



<footer>
  © 2026 Beatora Vibes
</footer>

<script>
function playSong(songFile){
  const player = document.getElementById("audioPlayer");
  player.src = songFile;
  player.play();
}
</script>

</body>
</html>
